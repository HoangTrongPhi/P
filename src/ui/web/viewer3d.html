<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project P Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d22; color: #d7dae0;
               font: 12px/1.4 "Segoe UI", system-ui, sans-serif; }
  #c { display: block; width: 100%; height: 100%; }
  #hud { position: absolute; top: 10px; left: 10px; padding: 8px 10px; border-radius: 6px;
         background: rgba(20, 22, 27, .78); border: 1px solid #2f333c; pointer-events: none;
         min-width: 170px; display: none; }
  #hud b { color: #7fb4ff; font-weight: 600; }
  #hud table { border-collapse: collapse; }
  #hud td { padding: 1px 6px 1px 0; } #hud td:last-child { text-align: right; color: #fff; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
         color: #8a909c; font-size: 14px; pointer-events: none; text-align: center; padding: 20px; }
  #msg.error { color: #ff8a80; }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/jsm/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="msg">Drop a .fbx / .obj / .glb / .gltf file to preview</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { TGALoader } from 'three/addons/loaders/TGALoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas = document.getElementById('c');
const hud = document.getElementById('hud');
const msg = document.getElementById('msg');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1d22);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
camera.position.set(3, 2, 4);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x30343c, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(5, 10, 7);
scene.add(sun);

let grid = new THREE.GridHelper(10, 20, 0x4a505c, 0x2c3038);
scene.add(grid);

let current = null;
let wireframe = false;
let uvChecker = false;
const originalMaterials = new Map();

// Absolute machine paths baked into FBX/OBJ files (C:\..., \\server\...) are rewritten to the
// bare file name; the local asset server then finds the file by name next to the model.
let modelBase = '';
const manager = new THREE.LoadingManager();
manager.setURLModifier((url) => {
  if (url.startsWith('blob:') || url.startsWith('data:')) return url;
  const decoded = decodeURIComponent(url);
  const tail = decoded.startsWith(modelBase) ? decoded.slice(modelBase.length) : decoded;
  if (/^[A-Za-z]:[\\/]|\\/.test(tail) || /\/[A-Za-z]:[\\/]/.test(decoded)) {
    const name = tail.split(/[\\/]/).pop();
    return modelBase + encodeURIComponent(name);
  }
  return url;
});
manager.addHandler(/\.tga$/i, new TGALoader(manager));

// A texture that failed to load renders black; once loading settles, drop maps without an image.
const failed = [];
manager.onError = (url) => { failed.push(url); console.warn('PP_MISSING ' + url); };
manager.onLoad = () => stripBrokenMaps();
function stripBrokenMaps() {
  if (!current || !failed.length) return;
  current.traverse((o) => {
    if (!o.isMesh) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => {
      if (!m) return;
      for (const [key, v] of Object.entries(m)) {
        if (v && v.isTexture && !v.isCanvasTexture && !v.image) { m[key] = null; m.needsUpdate = true; }
      }
    });
  });
}

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

renderer.setAnimationLoop(() => {
  controls.update();
  if (current && current.userData.mixer) current.userData.mixer.update(1 / 60);
  renderer.render(scene, camera);
});

function setMessage(text, isError = false) {
  msg.textContent = text || '';
  msg.className = isError ? 'error' : '';
}

function disposeCurrent() {
  if (!current) return;
  scene.remove(current);
  current.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    mats.forEach((m) => {
      Object.values(m).forEach((v) => { if (v && v.isTexture) v.dispose(); });
      m.dispose();
    });
  });
  originalMaterials.clear();
  current = null;
}

function frame(object) {
  const box = new THREE.Box3().setFromObject(object);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.length() / 2, 1e-3);
  const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.1;
  camera.near = dist / 1000;
  camera.far = dist * 100;
  camera.position.copy(center).add(new THREE.Vector3(0.6, 0.45, 0.8).normalize().multiplyScalar(dist));
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.update();

  scene.remove(grid);
  const step = Math.pow(10, Math.floor(Math.log10(radius)));
  grid = new THREE.GridHelper(step * 20, 20, 0x4a505c, 0x2c3038);
  grid.position.y = box.min.y;
  grid.visible = window.__gridVisible !== false;
  scene.add(grid);
}

function stats(object, extra) {
  let meshes = 0, vertices = 0, triangles = 0, skinned = 0, uvSets = 0;
  const materials = new Set();
  object.updateMatrixWorld(true);
  object.traverse((o) => {
    if (!o.isMesh) return;
    meshes++;
    if (o.isSkinnedMesh) skinned++;
    const g = o.geometry;
    const pos = g.attributes.position;
    if (!pos) return;
    vertices += pos.count;
    triangles += (g.index ? g.index.count : pos.count) / 3;
    uvSets = Math.max(uvSets, Object.keys(g.attributes).filter((k) => /^uv\d*$/.test(k)).length);
    (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => m && materials.add(m.uuid));
  });
  const size = new THREE.Box3().setFromObject(object).getSize(new THREE.Vector3());
  return {
    meshes, vertices, triangles: Math.round(triangles), materials: materials.size, skinned, uvSets,
    size: [size.x, size.y, size.z].map((v) => +v.toFixed(4)), ...extra,
  };
}

function showStats(s) {
  const fmt = (n) => n.toLocaleString('en-US');
  const rows = [
    ['Meshes', fmt(s.meshes)], ['Vertices', fmt(s.vertices)], ['Triangles', fmt(s.triangles)],
    ['Materials', fmt(s.materials)], ['UV sets', s.uvSets], ['Skinned', s.skinned],
    ['Animations', s.animations], ['Size', s.size.map((v) => v.toPrecision(3)).join(' × ')],
  ];
  hud.innerHTML = `<b>${s.name}</b><table>${rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table>`;
  hud.style.display = 'block';
  // picked up by the Qt side through javaScriptConsoleMessage
  console.log('PP_STATS ' + JSON.stringify(s));
}

async function loadObj(url) {
  const text = await (await fetch(url)).text();
  let obj = new OBJLoader(manager).parse(text);
  if (obj.materialLibraries && obj.materialLibraries.length) {
    try {
      const mtl = await new MTLLoader(manager).setPath(modelBase).loadAsync(obj.materialLibraries[0]);
      mtl.preload();
      obj = new OBJLoader(manager).setMaterials(mtl).parse(text);
    } catch (e) {
      console.warn('MTL not loaded: ' + e);
    }
  }
  obj.traverse((o) => {
    if (o.isMesh && o.material && o.material.type === 'MeshPhongMaterial' && !o.material.map) {
      o.material = new THREE.MeshStandardMaterial({ color: o.material.color, roughness: 0.6 });
    }
  });
  return { object: obj, animations: [] };
}

window.loadModel = async function (url, name) {
  disposeCurrent();
  failed.length = 0;
  hud.style.display = 'none';
  setMessage('Loading ' + name + ' …');
  modelBase = url.slice(0, url.lastIndexOf('/') + 1);
  const ext = name.split('.').pop().toLowerCase();
  try {
    let result;
    if (ext === 'glb' || ext === 'gltf') {
      const gltf = await new GLTFLoader(manager).loadAsync(url);
      result = { object: gltf.scene, animations: gltf.animations };
    } else if (ext === 'fbx') {
      const fbx = await new FBXLoader(manager).loadAsync(url);
      result = { object: fbx, animations: fbx.animations || [] };
    } else if (ext === 'obj') {
      result = await loadObj(url);
    } else {
      throw new Error('Unsupported format: .' + ext);
    }
    current = result.object;
    if (result.animations.length) {
      current.userData.mixer = new THREE.AnimationMixer(current);
      current.userData.mixer.clipAction(result.animations[0]).play();
    }
    scene.add(current);
    stripBrokenMaps();
    window.setWireframe(wireframe);
    window.setUvChecker(uvChecker);
    frame(current);
    setMessage('');
    showStats(stats(current, { name, animations: result.animations.length }));
  } catch (e) {
    console.error('PP_ERROR ' + (e && e.message ? e.message : e));
    setMessage('Could not load ' + name + '\n' + (e && e.message ? e.message : e), true);
  }
};

window.setWireframe = function (on) {
  wireframe = !!on;
  if (!current) return;
  current.traverse((o) => {
    if (!o.isMesh) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { if (m) m.wireframe = wireframe; });
  });
};

let checkerMaterial = null;
function makeChecker() {
  const size = 512, cells = 8, c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  for (let y = 0; y < cells; y++) {
    for (let x = 0; x < cells; x++) {
      ctx.fillStyle = (x + y) % 2 ? '#e6e6e6' : `hsl(${(x * cells + y) * 360 / (cells * cells)}, 60%, 45%)`;
      ctx.fillRect(x * size / cells, y * size / cells, size / cells, size / cells);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8 });
}

window.setUvChecker = function (on) {
  uvChecker = !!on;
  if (!current) return;
  if (uvChecker && !checkerMaterial) checkerMaterial = makeChecker();
  current.traverse((o) => {
    if (!o.isMesh) return;
    if (uvChecker) {
      if (!originalMaterials.has(o)) originalMaterials.set(o, o.material);
      o.material = checkerMaterial;
    } else if (originalMaterials.has(o)) {
      o.material = originalMaterials.get(o);
    }
  });
  if (!uvChecker) originalMaterials.clear();
  window.setWireframe(wireframe);
};

window.setGrid = function (on) { window.__gridVisible = !!on; grid.visible = !!on; };
window.resetView = function () { if (current) frame(current); };
window.clearModel = function () { disposeCurrent(); hud.style.display = 'none'; setMessage(''); };

console.log('PP_READY');
</script>
</body>
</html>
